    <script>
        function changeQuantity(amount) {
    let quantityInput = document.getElementById('quantity');
    let currentValue = parseInt(quantityInput.value) || 0; 

    let newValue = currentValue + amount;
    if (newValue >= 1) {
        quantityInput.value = newValue;
    } else {
        quantityInput.value = 1;
    }
}

    </script>
    <script>
        function checkout(){
            window.location.href = 'checkout0.html';
        }
window.addEventListener('DOMContentLoaded', function() {
   
    const momoDetails = JSON.parse(localStorage.getItem('selectedMomo'));

  
    if (momoDetails) {
      
        document.querySelector('.title').textContent = momoDetails.name;
        document.querySelector('.price').textContent = momoDetails.price;
        document.querySelector('.product-image').src = momoDetails.image;

      
        let aboutText = "";
        let featuresList = [];

       
        if (momoDetails.name === "Curry Momo") {
            aboutText = "Curry Momo is served with a rich, flavorful curry sauce made from fresh ingredients.";
            featuresList = [
                "Rich and flavorful curry sauce",
                "Perfect for spice lovers",
                "A fusion of tradition and taste"
            ];
        } else if (momoDetails.name === "Fried Momo") {
            aboutText = "Fried Momo is crispy and golden-brown with a flavorful veggie filling.";
            featuresList = [
                "Crispy texture on the outside",
                "Veggie-filled dumplings",
                "Perfect for snacking or as a starter"
            ];
        } else if (momoDetails.name === "Steamed Momo") {
            aboutText = "Steamed Momo is the classic momo, steamed to perfection and served with a tasty dipping sauce.";
            featuresList = [
                "Classic, soft, and juicy",
                "Ideal for a healthy snack",
                "Served with a tangy dipping sauce"
            ];
        } else if (momoDetails.name === "Jhol Momo") {
            aboutText = "Jhol Momo is steamed momo drenched in a spicy, tangy tomato-based soup.";
            featuresList = [
                "Delicious and spicy tomato-based soup",
                "Perfect for those who love tangy flavors",
                "A must-try for momo lovers"
            ];
        } else if (momoDetails.name === "Chili Momo") {
            aboutText = "Chili Momo is stir-fried with chilies and bold flavors for those who love spice.";
            featuresList = [
                "Spicy and flavorful",
                "Stir-fried with fresh chilies and spices",
                "Ideal for spice enthusiasts"
            ];
        } else if (momoDetails.name === "Tandoori Veg Momo") {
            aboutText = "Tandoori Veg Momo is marinated, smoky, and cooked in a tandoor for a charred finish.";
            featuresList = [
                "Smoky and charred",
                "Marinated in authentic tandoori spices",
                "Great for those looking for a unique flavor"
            ];
        } else if (momoDetails.name === "Momo Chaat") {
            aboutText = "Momo Chaat is a fusion dish with crispy momos topped with curd, chutneys, and crunchy toppings.";
            featuresList = [
                "A street-style fusion dish",
                "Combination of crispy and creamy textures",
                "Great for those who love chaat"
            ];
        }

      
        document.querySelector('.about-description').textContent = aboutText;

       
        const featuresListElement = document.querySelector('.features-list');
        featuresListElement.innerHTML = ''; 

        featuresList.forEach(feature => {
            const listItem = document.createElement('li');
            listItem.textContent = feature;
            featuresListElement.appendChild(listItem);
        });
    }
});



//Qcode
function changeQuantity(amount) {
    let quantityInput = document.getElementById('quantity');
    if (!quantityInput) {
        console.error("Quantity input field not found!");
        return;
    }
    console.log(quantityInput.value);
    let currentValue = parseInt(quantityInput.value) || 1; 
    if (currentValue + amount >= 1) {
        quantityInput.value = currentValue + amount;
    }
}

document.addEventListener('DOMContentLoaded', function() {
    let buyButton = document.querySelector('.btn-buy');
    if (!buyButton) {
        console.error("Buy button not found!");
        return;
    }

    buyButton.addEventListener('click', function(event) {
    event.preventDefault(); 

    let quantityInput = document.getElementById('quantity');
    let quantity = parseInt(quantityInput.value) || 1; 

    let momoDetails = JSON.parse(localStorage.getItem('selectedMomo')) || {};
    momoDetails.quantity = quantity; 
    localStorage.setItem('selectedMomo', JSON.stringify(momoDetails));

    window.location.href = 'checkout0.html'; 
});

});

    </script>
