<script>
   window.addEventListener('DOMContentLoaded', function() {
    const momoDetails = JSON.parse(localStorage.getItem('selectedMomo'));

    if (momoDetails) {
        document.querySelector('h1').textContent = momoDetails.name + " Checkout";
        document.querySelector('.momo-img').src = momoDetails.image;

        let quantity = momoDetails.quantity ? parseInt(momoDetails.quantity) : 1;
        const itemPrice = parseInt(momoDetails.price.replace("RS.", "").trim());
        const shippingFee = 20;
        const totalCost = itemPrice * quantity + shippingFee;

        document.querySelector('.summary').innerHTML = `
            <p><span>Item Quantity:</span> <span>${quantity}</span></p>
            <p><span>Item Cost:</span> <span>RS.${itemPrice * quantity}</span></p>
            <p><span>Shipping Fee:</span> <span>RS.${shippingFee}</span></p>
            <p class="total"><span>Total:</span> <span>RS.${totalCost}</span></p>
        `;

        // Check if sauce was already selected in localStorage
        const selectedSauce = localStorage.getItem('selectedSauce');
        if (selectedSauce) {
            document.getElementById("sauce").value = selectedSauce;
        }
    }
});

function proceedToCheckout() {
    const selectedSauce = document.getElementById("sauce").value;

    // Save selected sauce in localStorage
    localStorage.setItem('selectedSauce', selectedSauce);
 console.log(selectedSauce);

    window.location.href = 'checkout1.php';
}

</script>
